<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Levi's Quotes Department</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="paper">
      <header class="masthead">
        <p class="dept-no">FILE NO. LQD-2024</p>
        <p class="eyebrow">The Quotes Department</p>
        <h1>Levi's Quotes Department</h1>
        <p class="subtitle">All's fair in love and poetry.</p>
        <div class="rule"></div>
        <p class="byline">
          Archivist Levi Nathanael Tampus · BSIT-4 · DummyJSON Catalog
        </p>
      </header>

      <form class="filing" id="search-form" autocomplete="off">
        <label class="field">
          <span>Request from the archives</span>
          <input
            id="query"
            name="query"
            type="search"
            placeholder="love, courage, time…"
          />
        </label>
        <button type="submit">File search</button>
      </form>

      <section class="moods" aria-label="Mood codes">
        <p class="moods-label">Mood codes</p>
        <div class="mood-row" id="mood-row"></div>
      </section>

      <p class="status" id="status">The desk is open. Type a word, or press a code.</p>

      <section class="results" id="results" aria-live="polite"></section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
